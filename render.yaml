services:
  - type: web
    name: openinstinct
    env: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.24.0 --activate && pnpm install --frozen-lockfile && pnpm turbo run build:vercel && pnpm run build:eve
    startCommand: pnpm start
    autoDeploy: true
    healthCheckPath: /eve/v1/health
